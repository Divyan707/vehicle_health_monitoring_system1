services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  app:
    build: .
    restart: always
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_ENABLED: "1"
      DB_FILE: /data/vehicle_health.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
  gateway:
    build: .
    restart: always
    depends_on:
      - mosquitto
    command: ["python", "gateway.py"]
    environment:
      MQTT_HOST: mosquitto
